<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saha Defteri</title>
<meta name="theme-color" content="#1D428F">
<link rel="icon" href="img/okan.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Düzen: tek elle kullanılan saha uygulaması — üstte başlık, ortada liste, altta 4 sekme + yüzen "Not" butonu */
:root{
  --navy:#1D428F; --navy-2:#14306B; --sun:#F6C232; --leaf:#2FA84F; --red:#D6453D; --amber:#E08A00;
  --paper:#EEF2FA; --card:#FFFFFF; --ink:#141B2D; --muted:#5A6580; --line:#DCE3F0; --soft:#E4EAF6; --link:#1D428F;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--paper:#0C1222;--card:#151D33;--ink:#EEF2FB;--muted:#9AA6C2;--line:#26304A;--soft:#1D2742;--link:#9CC0FF;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.top h1{margin:0;font:800 24px/1.1 var(--display);letter-spacing:-.01em}
.top p{margin:2px 0 0;font-size:13px;color:#C9D7FA}
main{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--navy)}
@media (prefers-color-scheme: dark){nav button.on{color:var(--sun)}}
nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;
  background:var(--sun);color:#1A1A1A;border:0;border-radius:20px;height:58px;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:16px;box-shadow:0 6px 0 #C99A12,0 12px 24px rgba(0,0,0,.2);cursor:pointer}
.fab svg{width:24px;height:24px}
h2{font:700 12.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--soft);color:var(--ink);border-radius:999px;padding:3px 8px;letter-spacing:0}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);font-size:14.5px;text-align:center}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:grid;gap:6px;position:relative}
.item + .item{margin-top:8px}
.item.click{cursor:pointer}
.item .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.item .who{font-weight:700;font-size:16.5px;min-width:0;overflow-wrap:anywhere}
.item .co{color:var(--muted);font-size:14px}
.item .date{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.item .txt{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.item .next{font-size:14.5px;background:var(--soft);border-radius:10px;padding:8px 10px}
.item .next b{color:var(--link)}
.stripe{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0}
.late .stripe{background:var(--red)} .today .stripe{background:var(--amber)} .week .stripe{background:var(--navy)} .cold .stripe{background:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.p{background:rgba(29,66,143,.12);color:var(--link)}
.pill.r{background:rgba(214,69,61,.14);color:var(--red)}
.pill.a{background:rgba(224,138,0,.15);color:var(--amber)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.b{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.b.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.b.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.b.wa{background:#25D366;border-color:#25D366;color:#fff}
.b.dan{color:var(--red)}
.b svg{width:17px;height:17px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.daygrp{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 8px}
/* sayfa (form) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;display:none}
.sheet.on{display:block}
.sheet .top{display:flex;align-items:center;gap:10px}
.sheet .top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
.sheet .top h1{flex:1;font-size:20px}
.sheet main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px;letter-spacing:.02em}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
textarea{min-height:130px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 8px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mic{display:flex;align-items:center;gap:10px;margin-top:8px}
.mic button{border:0;background:var(--red);color:#fff;border-radius:999px;padding:11px 16px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.mic button svg{width:20px;height:20px}
.mic button.rec{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(214,69,61,.18)}}
.mic small{color:var(--muted);font-size:13px}
.save{width:100%;margin-top:22px;background:var(--sun);color:#1A1A1A;border:0;border-radius:16px;padding:16px;font-weight:800;font-size:17px;box-shadow:0 6px 0 #C99A12;cursor:pointer}
.pick{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:3;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 13px;cursor:pointer;font-size:15px}
.sug button + button{border-top:1px solid var(--line)}
.sug button small{color:var(--muted)}
/* kartım */
.mycard{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border-radius:22px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.mycard img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--sun)}
.mycard b{font:800 22px/1.1 var(--display);display:block}
.mycard span{font-size:13.5px;color:#C9D7FA}
.qrbox{margin-top:14px;background:#fff;border-radius:22px;padding:22px;display:grid;justify-items:center;gap:10px;border:1px solid var(--line)}
.qrbox #qr{width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.qrbox #qr svg{width:100%;height:100%;display:block}
.qrbox p{margin:0;color:#3A4560;font-size:14px;text-align:center}
.sunum{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:12px}
.sunum .big{width:100%;justify-content:center;background:#25D366;border:0;color:#fff;border-radius:16px;padding:16px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sunum .big svg{width:24px;height:24px}
.sunum .list{display:grid;gap:8px}
.sunum .doc{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;text-decoration:none;color:inherit}
.sunum .doc img{width:92px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line);max-width:100%}
.sunum .doc b{display:block;font-size:14.5px}
.sunum .doc small{color:var(--muted);font-size:12.5px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hist{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.hist .item{margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#141B2D;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.2s;z-index:40;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.5);display:none;align-items:flex-end;justify-content:center;padding:16px}
.dlg.on{display:flex}
.dlg > div{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:440px;margin-bottom:env(safe-area-inset-bottom,0px)}
.dlg p{margin:0 0 16px;font-size:16px}
.dlg .btns{justify-content:flex-end}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><h1 id="ttl">Bu Hafta</h1><p id="sub"></p></header>
<main id="view"></main>

<button class="fab" id="fab" type="button" aria-label="Yeni ziyaret notu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Not</button>
<nav id="nav">
  <button data-t="hafta" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 15l2 2 4-4"/></svg>Bu Hafta</button>
  <button data-t="defter" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5M9 7h7M9 11h5"/></svg>Defter</button>
  <button data-t="kisiler" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Müşteriler</button>
  <button data-t="kart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2.5"/><path d="M13 10h5M13 14h3"/></svg>Kartım</button>
</nav>

<!-- ziyaret notu formu -->
<div class="sheet" id="sNote">
  <header class="top"><button type="button" data-close>Vazgeç</button><h1 id="nTtl">Yeni not</h1></header>
  <main>
    <label for="nDate">Tarih</label>
    <input type="date" id="nDate">
    <label>Görüşme şekli</label>
    <div class="seg" id="nType"><button type="button" data-v="Ziyaret">Ziyaret</button><button type="button" data-v="Telefon">Telefon</button><button type="button" data-v="Toplantı">Toplantı</button><button type="button" data-v="E-posta">E-posta</button></div>
    <label for="nWho">Kimle görüşüldü</label>
    <div class="pick"><input type="text" id="nWho" placeholder="Ad Soyad (yazmaya başlayın)" autocomplete="off"><div class="sug" id="nSug" hidden></div></div>
    <div class="two">
      <div><label for="nCo">Firma</label><input type="text" id="nCo" list="dlCo" placeholder="Firma adı"></div>
      <div><label for="nTel">Telefon</label><input type="tel" id="nTel" placeholder="05xx…"></div>
    </div>
    <label for="nProj">Hangi proje konuşuldu</label>
    <input type="text" id="nProj" list="dlProj" placeholder="Örn. Manisa OSB 2500 kVA köşk">
    <label for="nText">Notlar</label>
    <textarea id="nText" placeholder="Konuşulanlar, fiyat, rakip, istekler…"></textarea>
    <div class="mic"><button type="button" id="micBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg><span>Sesli not</span></button><small id="micInfo">Konuşun, yazıya çevireyim.</small></div>
    <label for="nNext">Sonraki adım</label>
    <input type="text" id="nNext" placeholder="Örn. Revize teklif gönder, tekrar ara">
    <label for="nNextDate">Ne zaman</label>
    <div class="seg" id="nQuick"><button type="button" data-d="1">Yarın</button><button type="button" data-d="3">3 gün</button><button type="button" data-d="7">1 hafta</button><button type="button" data-d="14">2 hafta</button><button type="button" data-d="30">1 ay</button></div>
    <input type="date" id="nNextDate" style="margin-top:8px">
    <button class="save" type="button" id="nSave">Kaydet</button>
    <div class="btns" style="margin-top:14px" id="nDelWrap" hidden><button class="b dan" type="button" id="nDel">Bu notu sil</button></div>
  </main>
</div>

<!-- müşteri formu -->
<div class="sheet" id="sContact">
  <header class="top"><button type="button" data-close>Vazgeç</button><h1 id="cTtl">Yeni müşteri</h1></header>
  <main>
    <div class="btns" id="cPickWrap" hidden><button class="b" type="button" id="cPick">Telefon rehberinden seç</button></div>
    <label for="cName">Ad Soyad</label><input type="text" id="cName">
    <div class="two">
      <div><label for="cCo">Firma</label><input type="text" id="cCo" list="dlCo"></div>
      <div><label for="cTitle">Görevi</label><input type="text" id="cTitle" placeholder="Satınalma, proje…"></div>
    </div>
    <div class="two">
      <div><label for="cTel">Telefon</label><input type="tel" id="cTel"></div>
      <div><label for="cCity">Şehir</label><input type="text" id="cCity" placeholder="İzmir, Manisa…"></div>
    </div>
    <label for="cMail">E-posta</label><input type="email" id="cMail">
    <label for="cNote">Not</label><input type="text" id="cNote" placeholder="Örn. EPC firması, Astor tercih ediyor">
    <button class="save" type="button" id="cSave">Kaydet</button>
    <div class="btns" style="margin-top:14px" id="cDelWrap" hidden><button class="b dan" type="button" id="cDel">Müşteriyi sil</button></div>
  </main>
</div>

<!-- müşteri detayı -->
<div class="sheet" id="sDetail">
  <header class="top"><button type="button" data-close>Geri</button><h1 id="dTtl"></h1></header>
  <main id="dBody"></main>
</div>

<div class="dlg" id="dlg"><div><p id="dlgMsg"></p><div class="btns"><button class="b" type="button" id="dlgNo">Vazgeç</button><button class="b pri" type="button" id="dlgYes">Evet</button></div></div></div>
<div class="toast" id="toast"></div>
<datalist id="dlCo"></datalist><datalist id="dlProj"></datalist>

<script src="qrcode.js"></script>
<script>
'use strict';
var CARD_URL='https://okanozdenroll-afk.github.io/e-kartvizit/';
var KEY='kvk_defter_v1';
/* Paylaşılacak sunumlar — yeni sunum eklemek için sunumlar/ klasörüne PDF koyup buraya bir satır ekleyin */
var SUNUMLAR=[
  {file:'sunumlar/KVK_Enerji_Referanslar_2026.pdf',name:'KVK Enerji Referanslar 2026.pdf',title:'KVK Enerji — Referans Projeler 2026',info:'25 sayfa · GES, RES, OG hücre, köşk, şarj',img:'img/sunum1.jpg'}
];
var IS_APP=!!(window.Android&&window.Android.speech);
var D;
function blank(){return {contacts:[],visits:[],settings:{coldDays:30}}}
function load(){try{D=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){D=blank()}
  D.contacts=D.contacts||[];D.visits=D.visits||[];D.settings=D.settings||{coldDays:30}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Kaydedilemedi: hafıza dolu olabilir')}}
load();
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},2400)}
function ask(msg,yes){$('dlgMsg').textContent=msg;$('dlg').classList.add('on');$('dlgYes').onclick=function(){$('dlg').classList.remove('on');yes()};$('dlgNo').onclick=function(){$('dlg').classList.remove('on')}}

/* ---- tarih ---- */
function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function weekEnd(){var d=new Date();var w=(d.getDay()+6)%7;d.setDate(d.getDate()+(6-w));return iso(d)}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
var AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function nice(s){if(!s)return'';var t=today(),n=daysBetween(t,s);if(n===0)return'Bugün';if(n===1)return'Yarın';if(n===-1)return'Dün';
  var d=new Date(s+'T12:00:00');var r=d.getDate()+' '+AY[d.getMonth()];if(d.getFullYear()!==new Date().getFullYear())r+=' '+d.getFullYear();
  if(n>1&&n<7)r=GUN[d.getDay()]+', '+r;return r}

/* ---- yardımcı ---- */
function contact(id){for(var i=0;i<D.contacts.length;i++)if(D.contacts[i].id===id)return D.contacts[i];return null}
function telDigits(t){var s=String(t||'').replace(/\D/g,'');if(!s)return'';if(s.indexOf('90')===0&&s.length===12)return s;if(s[0]==='0')s=s.slice(1);if(s.length===10)return'90'+s;return s}
function telLink(t){var d=telDigits(t);return d?'tel:+'+d:''}
function waLink(t){var d=telDigits(t);return d?'https://wa.me/'+d:''}
function lastVisit(cid){var l=null;D.visits.forEach(function(v){if(v.contactId===cid&&(!l||v.date>l.date))l=v});return l}
function norm(s){return String(s||'').toLocaleLowerCase('tr').replace(/\s+/g,' ').trim()}
function refreshLists(){
  var cos={},pr={};D.contacts.forEach(function(c){if(c.company)cos[c.company]=1});D.visits.forEach(function(v){if(v.company)cos[v.company]=1;if(v.project)pr[v.project]=1});
  $('dlCo').innerHTML=Object.keys(cos).sort().map(function(x){return'<option value="'+esc(x)+'">'}).join('');
  $('dlProj').innerHTML=Object.keys(pr).sort().map(function(x){return'<option value="'+esc(x)+'">'}).join('');
}

function callBtns(tel){if(!tel)return'';return'<a class="b pri" href="'+telLink(tel)+'">'+IC.tel+'Ara</a><a class="b wa" href="'+waLink(tel)+'" target="_blank" rel="noopener">'+IC.wa+'WhatsApp</a>'}

var TAB='hafta',FILTER='',PROJ='';
function show(t){TAB=t;document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});render();window.scrollTo(0,0)}
document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
function render(){refreshLists();badge();({hafta:rHafta,defter:rDefter,kisiler:rKisiler,kart:rKart})[TAB]()}
function badge(){var n=todo().filter(function(x){return x.when<=today()}).length;var b=document.querySelector('#nav [data-t=hafta]');
  var s=b.querySelector('.badge');if(n){if(!s){s=document.createElement('span');s.className='badge';b.appendChild(s)}s.textContent=n}else if(s)s.remove()}

/* açık "sonraki adımlar" */
function todo(){return D.visits.filter(function(v){return v.nextDate&&!v.done}).map(function(v){return{v:v,when:v.nextDate}}).sort(function(a,b){return a.when<b.when?-1:1})}
function coldList(){var lim=D.settings.coldDays||30,t=today(),open={};todo().forEach(function(x){if(x.v.contactId)open[x.v.contactId]=1});
  return D.contacts.map(function(c){var l=lastVisit(c.id);return{c:c,l:l,days:l?daysBetween(l.date,t):null}})
    .filter(function(x){return!open[x.c.id]&&x.l&&x.days>=lim}).sort(function(a,b){return b.days-a.days}).slice(0,15)}

function todoCard(x,cls){var v=x.v,c=v.contactId?contact(v.contactId):null,tel=(c&&c.phone)||v.phone;
  var late=daysBetween(x.when,today());
  var pill=late>0?'<span class="pill r">'+late+' gün gecikti</span>':late===0?'<span class="pill a">Bugün</span>':'<span class="pill p">'+nice(x.when)+'</span>';
  return'<div class="item '+cls+'"><span class="stripe"></span><div class="row"><span class="who">'+esc(c?c.name:(v.who||'İsimsiz'))+'</span>'+pill+'</div>'+
  '<div class="co">'+esc([c?c.company:v.company,v.project].filter(Boolean).join(' · '))+'</div>'+
  '<div class="next"><b>Yapılacak:</b> '+esc(v.next||'Takip et')+'</div>'+
  '<div class="btns">'+callBtns(tel)+'<button class="b ok" type="button" data-done="'+v.id+'">'+IC.ok+'Yapıldı</button>'+
  (c?'<button class="b" type="button" data-open="'+c.id+'">Geçmiş</button>':'')+'</div></div>'}

function rHafta(){
  $('ttl').textContent='Bu hafta kimi aramalıyım?';
  var d=new Date();$('sub').textContent=GUN[d.getDay()]+', '+d.getDate()+' '+AY[d.getMonth()]+' '+d.getFullYear();
  var t=today(),we=weekEnd(),all=todo();
  var late=all.filter(function(x){return x.when<t}),tod=all.filter(function(x){return x.when===t}),wk=all.filter(function(x){return x.when>t&&x.when<=we}),
      soon=all.filter(function(x){return x.when>we&&x.when<=addDays(t,14)}),cold=coldList();
  var h='';
  function sec(title,arr,cls,empty){h+='<h2>'+title+' <span class="n">'+arr.length+'</span></h2>';h+=arr.length?arr.map(function(x){return todoCard(x,cls)}).join(''):(empty?'<div class="empty">'+empty+'</div>':'')}
  if(!D.visits.length){h+='<div class="empty" style="margin-top:8px">Henüz not yok. Sağ alttaki <b>Not</b> butonuyla ilk ziyaretinizi yazın; “sonraki adım” tarihi verdiğiniz her şey burada listelenir.</div>'}
  if(late.length)sec('Gecikenler',late,'late');
  sec('Bugün',tod,'today',D.visits.length?'Bugün için planlı arama yok.':'');
  sec('Bu hafta',wk,'week',D.visits.length?'Hafta sonuna kadar planlı arama yok.':'');
  if(soon.length)sec('Gelecek hafta',soon,'week');
  if(cold.length){h+='<h2>Uzun süredir aranmayanlar <span class="n">'+cold.length+'</span></h2>';
    h+=cold.map(function(x){return'<div class="item cold"><span class="stripe"></span><div class="row"><span class="who">'+esc(x.c.name)+'</span><span class="pill">'+x.days+' gün</span></div>'+
      '<div class="co">'+esc([x.c.company,x.l.project].filter(Boolean).join(' · '))+'</div><div class="btns">'+callBtns(x.c.phone)+'<button class="b" type="button" data-open="'+x.c.id+'">Geçmiş</button></div></div>'}).join('')}
  if(all.length||cold.length)h+='<div class="btns" style="margin-top:18px"><button class="b" type="button" id="shareWeek">Listeyi paylaş (WhatsApp / e-posta)</button></div>';
  $('view').innerHTML=h;
  var sw=$('shareWeek');if(sw)sw.onclick=function(){shareText(weekText(late,tod,wk,cold))};
}
function weekText(late,tod,wk,cold){var L=['📋 Bu hafta aranacaklar ('+nice(today())+')'];
  function add(t,arr){if(!arr.length)return;L.push('','*'+t+'*');arr.forEach(function(x){var v=x.v,c=v.contactId?contact(v.contactId):null;
    L.push('• '+(c?c.name:v.who||'')+((c&&c.company)||v.company?' ('+((c&&c.company)||v.company)+')':'')+' — '+(v.next||'takip')+' ['+nice(x.when)+']'+((c&&c.phone)||v.phone?' '+((c&&c.phone)||v.phone):''))})}
  add('Gecikenler',late);add('Bugün',tod);add('Bu hafta',wk);
  if(cold.length){L.push('','*Uzun süredir aranmayanlar*');cold.forEach(function(x){L.push('• '+x.c.name+(x.c.company?' ('+x.c.company+')':'')+' — '+x.days+' gün')})}
  return L.join('\n')}

function rDefter(){
  $('ttl').textContent='Saha Satış Defteri';$('sub').textContent=D.visits.length+' görüşme notu';
  var pr={};D.visits.forEach(function(v){if(v.project)pr[v.project]=(pr[v.project]||0)+1});
  var h='<input class="search" id="q" type="search" placeholder="Ara: kişi, firma, proje, not…" value="'+esc(FILTER)+'">';
  var pk=Object.keys(pr).sort(function(a,b){return pr[b]-pr[a]});
  if(pk.length)h+='<div class="chips"><button type="button" data-p=""'+(PROJ?'':' class="on"')+'>Tümü</button>'+pk.map(function(p){return'<button type="button" data-p="'+esc(p)+'"'+(PROJ===p?' class="on"':'')+'>'+esc(p)+'</button>'}).join('')+'</div>';
  var q=norm(FILTER);
  var list=D.visits.filter(function(v){if(PROJ&&v.project!==PROJ)return false;if(!q)return true;var c=v.contactId?contact(v.contactId):null;
    return norm([v.who,v.company,v.project,v.text,v.next,c&&c.name,c&&c.company].join(' ')).indexOf(q)>=0}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.created<b.created?1:-1)});
  if(!list.length)h+='<div class="empty" style="margin-top:14px">'+(D.visits.length?'Aramaya uyan not yok.':'İlk ziyaret notunuzu <b>Not</b> butonuyla ekleyin. Sesli not da alabilirsiniz.')+'</div>';
  var last='';
  list.forEach(function(v){var m=v.date.slice(0,7);if(m!==last){last=m;var d=new Date(v.date+'T12:00:00');h+='<div class="daygrp">'+AY[d.getMonth()]+' '+d.getFullYear()+'</div>'}h+=visitCard(v,true)});
  $('view').innerHTML=h;
  var qi=$('q');qi.oninput=function(){FILTER=qi.value;var p=qi.selectionStart;rDefter();var n=$('q');n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
  document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){PROJ=b.dataset.p;rDefter()}});
}
function visitCard(v,showWho){var c=v.contactId?contact(v.contactId):null;
  var st=v.nextDate?(v.done?'<span class="pill">✓ yapıldı</span>':(v.nextDate<today()?'<span class="pill r">gecikti</span>':'<span class="pill p">'+nice(v.nextDate)+'</span>')):'';
  return'<div class="item click" data-edit="'+v.id+'"><div class="row"><span class="who">'+(showWho?esc(c?c.name:(v.who||'İsimsiz')):esc(v.type||'Görüşme'))+'</span><span class="date">'+nice(v.date)+(showWho?' · '+esc(v.type||''):'')+'</span></div>'+
  ((showWho&&(c&&c.company||v.company))||v.project?'<div class="co">'+esc([showWho?(c&&c.company)||v.company:'',v.project].filter(Boolean).join(' · '))+'</div>':'')+
  (v.text?'<div class="txt">'+esc(v.text)+'</div>':'')+
  (v.next?'<div class="next"><b>Sonraki adım:</b> '+esc(v.next)+' '+st+'</div>':'')+'</div>'}

function rKisiler(){
  $('ttl').textContent='Müşteriler';$('sub').textContent=D.contacts.length+' kişi';
  var h='<div style="display:flex;gap:8px"><input class="search" id="q2" type="search" placeholder="Ara: isim, firma, şehir…" value="'+esc(FILTER)+'"><button class="b pri" type="button" id="addC" style="flex:none">+ Yeni</button></div>';
  var q=norm(FILTER);

    .map(function(c){return{c:c,l:lastVisit(c.id)}}).sort(function(a,b){return(a.c.name||'').localeCompare(b.c.name||'','tr')});
  if(!list.length)h+='<div class="empty" style="margin-top:14px">'+(D.contacts.length?'Aramaya uyan kişi yok.':'Görüştüğünüz kişiler not yazarken otomatik eklenir. İsterseniz <b>+ Yeni</b> ile şimdi ekleyin.')+'</div>';
  h+='<div style="margin-top:12px">'+list.map(function(x){var c=x.c;return'<div class="item click" data-open="'+c.id+'"><div class="row"><span class="who">'+esc(c.name)+'</span><span class="date">'+(x.l?'Son: '+nice(x.l.date):'Görüşme yok')+'</span></div>'+
    '<div class="co">'+esc([c.title,c.company,c.city].filter(Boolean).join(' · '))+'</div></div>'}).join('')+'</div>';
  h+='<h2>Yedek</h2><div class="btns"><button class="b" type="button" id="bkOut">Yedek al</button><button class="b" type="button" id="bkIn">Yedeği yükle</button></div><input type="file" id="bkFile" accept=".json,application/json" hidden>'+
     '<p style="font-size:13px;color:var(--muted);margin-top:8px">Notlar yalnız bu telefonda durur. Ara sıra yedek alıp kendinize e-postayla gönderin.</p>';
  $('view').innerHTML=h;
  var qi=$('q2');qi.oninput=function(){FILTER=qi.value;var p=qi.selectionStart;rKisiler();var n=$('q2');n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
  $('addC').onclick=function(){openContact(null)};
  $('bkOut').onclick=backupOut;$('bkIn').onclick=function(){$('bkFile').click()};$('bkFile').onchange=backupIn;

/* ---- paylaşım / yedek ---- */
function shareSunum(){
  if(IS_APP&&Android.shareAssets){Android.shareAssets(JSON.stringify(SUNUMLAR.map(function(x){return{asset:x.file,name:x.name}})),'application/pdf');return}
  toast('Sunumlar hazırlanıyor…');
  Promise.all(SUNUMLAR.map(function(x){return fetch(x.file).then(function(r){return r.blob()}).then(function(b){return new File([b],x.name,{type:'application/pdf'})})}))
  .then(function(files){if(navigator.canShare&&navigator.canShare({files:files}))return navigator.share({files:files,title:'KVK Enerji sunumları'});throw 0})
  .catch(function(e){if(e&&e.name==='AbortError')return;shareText('KVK Enerji sunumlarımız:\n'+SUNUMLAR.map(function(x){return'• '+x.title+': '+CARD_URL+x.file}).join('\n'))})}

function shareText(t){if(IS_APP&&Android.shareText){Android.shareText(t);return}
  if(navigator.share){navigator.share({text:t}).catch(function(){});return}
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('Panoya kopyalandı')},function(){toast('Kopyalanamadı')})}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function backupOut(){var name='SahaDefteri_'+today()+'.json',txt=JSON.stringify({app:'KVK Saha Defteri',v:1,data:D},null,1);
  if(IS_APP&&Android.shareFile){Android.shareFile(name,'application/json',b64(txt));return}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function backupIn(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);var d=o.data||o;if(!d.visits||!d.contacts)throw 0;
  ask('Yedek yüklensin mi? Bu telefondaki notların yerine '+d.visits.length+' not ve '+d.contacts.length+' kişi gelecek.',function(){D=d;D.settings=D.settings||{coldDays:30};save();render();toast('Yedek yüklendi')})}catch(x){toast('Bu dosya bir Saha Defteri yedeği değil')}};r.readAsText(f);e.target.value=''}

/* ziyaret notu */
var EDIT=null,PICK=null,NTYPE='Ziyaret';
function setType(t){NTYPE=t;document.querySelectorAll('#nType button').forEach(function(b){b.classList.toggle('on',b.dataset.v===t)})}
document.querySelectorAll('#nType button').forEach(function(b){b.onclick=function(){setType(b.dataset.v)}});
document.querySelectorAll('#nQuick button').forEach(function(b){b.onclick=function(){$('nNextDate').value=addDays(today(),+b.dataset.d);document.querySelectorAll('#nQuick button').forEach(function(x){x.classList.toggle('on',x===b)})}});
$('nNextDate').oninput=function(){document.querySelectorAll('#nQuick button').forEach(function(x){x.classList.remove('on')})};
function openNote(v,cid){EDIT=v||null;PICK=null;var c=v&&v.contactId?contact(v.contactId):(cid?contact(cid):null);if(c)PICK=c.id;
  $('nTtl').textContent=v?'Notu düzenle':'Yeni ziyaret notu';
  $('nDate').value=v?v.date:today();setType(v?v.type||'Ziyaret':'Ziyaret');
  $('nWho').value=c?c.name:(v&&v.who||'');$('nCo').value=c?c.company||'':(v&&v.company||'');$('nTel').value=c?c.phone||'':(v&&v.phone||'');
  $('nProj').value=v?v.project||'':(c?lastProj(c.id):'');$('nText').value=v?v.text||'':'';$('nNext').value=v?v.next||'':'';$('nNextDate').value=v?v.nextDate||'':'';
  document.querySelectorAll('#nQuick button').forEach(function(x){x.classList.remove('on')});
  $('nDelWrap').hidden=!v;$('nSug').hidden=true;openSheet('sNote')}
function lastProj(cid){var l=null;D.visits.forEach(function(v){if(v.contactId===cid&&v.project&&(!l||v.date>l.date))l=v});return l?l.project:''}
$('fab').onclick=function(){openNote(null)};
$('nWho').oninput=function(){PICK=null;var q=norm($('nWho').value),s=$('nSug');if(q.length<1){s.hidden=true;return}
  var m=D.contacts.filter(function(c){return norm(c.name+' '+c.company).indexOf(q)>=0}).slice(0,6);
  if(!m.length){s.hidden=true;return}
  s.innerHTML=m.map(function(c){return'<button type="button" data-c="'+c.id+'">'+esc(c.name)+' <small>'+esc(c.company||'')+'</small></button>'}).join('');s.hidden=false;
  s.querySelectorAll('button').forEach(function(b){b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){var c=contact(b.dataset.c);PICK=c.id;$('nWho').value=c.name;$('nCo').value=c.company||'';$('nTel').value=c.phone||'';if(!$('nProj').value)$('nProj').value=lastProj(c.id);s.hidden=true}})};
$('nWho').onblur=function(){setTimeout(function(){$('nSug').hidden=true},150)};
$('nSave').onclick=function(){
  var who=$('nWho').value.trim(),co=$('nCo').value.trim(),tel=$('nTel').value.trim();
  if(!who&&!co){toast('Kimle görüştüğünüzü ya da firmayı yazın');$('nWho').focus();return}
  if($('nNextDate').value&&!$('nNext').value.trim())$('nNext').value='Tekrar ara';
  var cid=PICK;
  if(!cid&&who){var ex=D.contacts.filter(function(c){return norm(c.name)===norm(who)&&(!co||!c.company||norm(c.company)===norm(co))})[0];
    if(ex)cid=ex.id;else{var nc={id:uid(),name:who,company:co,phone:tel,created:Date.now()};D.contacts.push(nc);cid=nc.id}}
  if(cid){var c=contact(cid);if(co&&!c.company)c.company=co;if(tel&&!c.phone)c.phone=tel}
  var v=EDIT||{id:uid(),created:Date.now()};
  v.date=$('nDate').value||today();v.type=NTYPE;v.contactId=cid||null;v.who=cid?'':who;v.company=co;v.phone=cid?'':tel;
  v.project=$('nProj').value.trim();v.text=$('nText').value.trim();v.next=$('nNext').value.trim();
  var nd=$('nNextDate').value;if(nd!==(EDIT&&EDIT.nextDate))v.done=false;v.nextDate=nd;
  if(!EDIT)D.visits.push(v);save();
  // aynı kişinin önceki açık adımlarını kapat (yeni görüşme yapıldı)
  if(!EDIT&&cid)D.visits.forEach(function(o){if(o!==v&&o.contactId===cid&&o.nextDate&&!o.done&&o.date<=v.date)o.done=true});save();
  closeSheet();toast(v.nextDate?'Kaydedildi · '+nice(v.nextDate)+' hatırlatılacak':'Kaydedildi')};
$('nDel').onclick=function(){ask('Bu not silinsin mi?',function(){D.visits=D.visits.filter(function(x){return x!==EDIT});save();closeSheet();toast('Silindi')})};

/* sesli not */
var REC=null,MICON=false,BASE='';
function micUI(on){MICON=on;$('micBtn').classList.toggle('rec',on);$('micBtn').querySelector('span').textContent=on?'Durdur':'Sesli not';$('micInfo').textContent=on?'Dinliyorum… konuşun.':'Konuşun, yazıya çevireyim.'}
function appendText(t){if(!t)return;var a=$('nText');a.value=(a.value&&!/\s$/.test(a.value)?a.value+' ':a.value)+t.charAt(0).toLocaleUpperCase('tr')+t.slice(1)}
window.onSpeech=function(t){micUI(false);if(t){appendText(t);toast('Not yazıya çevrildi')}};
window.onSpeechErr=function(m){micUI(false);toast(m||'Ses tanınamadı')};
function stopMic(){if(REC){try{REC.stop()}catch(e){}}micUI(false)}
$('micBtn').onclick=function(){
  if(MICON){stopMic();return}
  if(IS_APP){micUI(true);Android.speech();return}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Bu tarayıcı sesli yazmayı desteklemiyor. Klavyedeki mikrofonu kullanın.');$('nText').focus();return}
  REC=new SR();REC.lang='tr-TR';REC.continuous=true;REC.interimResults=true;BASE=$('nText').value;
  REC.onresult=function(e){var fin='',tmp='';for(var i=0;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';else tmp+=e.results[i][0].transcript}
    $('nText').value=(BASE?BASE.replace(/\s*$/,' '):'')+(fin+tmp).trim()};
  REC.onerror=function(e){toast(e.error==='not-allowed'?'Mikrofon izni verilmedi':'Ses alınamadı')};
  REC.onend=function(){REC=null;micUI(false)};
  try{REC.start();micUI(true)}catch(e){toast('Mikrofon açılamadı')}};

/* müşteri */
var CEDIT=null;
function openContact(c){CEDIT=c;$('cTtl').textContent=c?'Müşteriyi düzenle':'Yeni müşteri';
  ['Name','Co','Title','Tel','City','Mail','Note'].forEach(function(k){$('c'+k).value=c?(c[{Name:'name',Co:'company',Title:'title',Tel:'phone',City:'city',Mail:'email',Note:'note'}[k]]||''):''});
  $('cDelWrap').hidden=!c;$('cPickWrap').hidden=!(IS_APP&&Android.pickContact)||!!c;openSheet('sContact')}
$('cPick').onclick=function(){Android.pickContact()};
window.onContactPicked=function(o){try{if(typeof o==='string')o=JSON.parse(o)}catch(e){return}if(o.name)$('cName').value=o.name;if(o.phone)$('cTel').value=o.phone;if(o.email)$('cMail').value=o.email;if(o.company&&!$('cCo').value)$('cCo').value=o.company};
$('cSave').onclick=function(){var n=$('cName').value.trim();if(!n){toast('Ad Soyad yazın');return}
  var c=CEDIT||{id:uid(),created:Date.now()};c.name=n;c.company=$('cCo').value.trim();c.title=$('cTitle').value.trim();c.phone=$('cTel').value.trim();
  c.city=$('cCity').value.trim();c.email=$('cMail').value.trim();c.note=$('cNote').value.trim();if(!CEDIT)D.contacts.push(c);save();closeSheet();toast('Kaydedildi')};
$('cDel').onclick=function(){var c=CEDIT,n=D.visits.filter(function(v){return v.contactId===c.id}).length;
  ask(c.name+' silinsin mi?'+(n?' '+n+' görüşme notu da silinecek.':''),function(){D.contacts=D.contacts.filter(function(x){return x!==c});D.visits=D.visits.filter(function(v){return v.contactId!==c.id});save();STACK=[];['sContact','sDetail'].forEach(function(i){$(i).classList.remove('on')});render();toast('Silindi')})};

/* müşteri detayı */
var DET=null;
function openDetail(id,refresh){var c=contact(id);if(!c)return;DET=id;$('dTtl').textContent=c.name;
  var vs=D.visits.filter(function(v){return v.contactId===id}).sort(function(a,b){return a.date<b.date?1:-1});
  var h='<div class="item"><div class="who">'+esc(c.name)+'</div><div class="co">'+esc([c.title,c.company,c.city].filter(Boolean).join(' · '))+'</div>'+
    (c.phone?'<div class="txt">'+esc(c.phone)+'</div>':'')+(c.email?'<div class="txt"><a href="mailto:'+esc(c.email)+'" style="color:var(--link)">'+esc(c.email)+'</a></div>':'')+(c.note?'<div class="txt" style="color:var(--muted)">'+esc(c.note)+'</div>':'')+
    '<div class="btns">'+callBtns(c.phone)+'<button class="b" type="button" id="dEdit">Düzenle</button></div></div>'+
    '<div class="btns" style="margin-top:12px"><button class="b ok" type="button" id="dNote">+ Bu kişiye not ekle</button></div>'+
    '<h2>Görüşme geçmişi <span class="n">'+vs.length+'</span></h2>'+(vs.length?'<div class="hist">'+vs.map(function(v){return visitCard(v,false)}).join('')+'</div>':'<div class="empty">Henüz görüşme notu yok.</div>');
  $('dBody').innerHTML=h;$('dEdit').onclick=function(){openContact(c)};$('dNote').onclick=function(){openNote(null,c.id)};
  if(!refresh)openSheet('sDetail')}

/* genel tıklamalar */
document.addEventListener('click',function(e){var t=e.target.closest('[data-done],[data-open],[data-edit]');if(!t)return;
  if(t.dataset.done){var v=D.visits.filter(function(x){return x.id===t.dataset.done})[0];if(!v)return;v.done=true;save();render();
    toast('Tamamlandı');setTimeout(function(){ask('Görüşmeyi deftere yazmak ister misiniz?',function(){openNote(null,v.contactId)})},350);return}
  if(t.dataset.open){openDetail(t.dataset.open);return}
  if(t.dataset.edit){var w=D.visits.filter(function(x){return x.id===t.dataset.edit})[0];if(w)openNote(w)}});

show('hafta');
</script>
